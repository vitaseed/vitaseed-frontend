<body class="account-page"><div class="announce">Small-batch nutrition seeds, packed fresh for your kitchen</div><header class="wrap nav"><a class="brand" href="index.html">The Gami Co.</a><nav class="nav-links"><a href="shop.html">Shop</a><a class="active" href="profile.html">Profile</a><a href="orders.html">Orders</a><button class="btn-ghost" type="button" data-logout>Log out</button></nav></header><main class="account-shell"><section class="account-card"><p class="eyebrow">Your account</p><h1 id="profileTitle">Profile</h1><p id="profileIntro">Your saved details, ready when you are.</p><form id="profileForm" class="auth-form"><label>Full name<input id="profileName" required /></label><label>Email<input id="profileEmail" type="email" readonly /></label><label>Delivery note<textarea id="profileNote" rows="4" placeholder="Apartment, landmark, or delivery preference"></textarea></label><button class="btn" type="submit">Save details</button><p id="profileMessage" class="form-message" role="status"></p></form><div class="account-links"><a class="btn-ghost" href="orders.html">View orders</a><a class="btn-ghost" href="shop.html">Continue shopping</a></div></section></main><script src="js/main.js"></script></body>
