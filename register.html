<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Create account | The Gami Co.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="css/style.css" />

<body class="account-page">
  <div class="announce">Small-batch nutrition seeds, packed fresh for your kitchen</div>
  <header class="wrap nav"><a class="brand" href="index.html">The Gami Co.</a><nav class="nav-links"><a href="shop.html">Shop</a><a href="login.html">Log in</a></nav></header>
  <main class="auth-shell"><section class="auth-card"><p class="eyebrow">Start your pantry ritual</p><h1>Create account</h1><p>Save your delivery details and follow every order from one quiet little home base.</p><form id="registerForm" class="auth-form"><label>Full name<input type="text" id="registerName" required autocomplete="name" /></label><label>Email<input type="email" id="registerEmail" required autocomplete="email" /></label><label>Password<input type="password" id="registerPassword" minlength="6" required autocomplete="new-password" /></label><button class="btn" type="submit">Create account</button><p id="registerMessage" class="form-message" role="status"></p></form><p class="form-foot">Already registered? <a href="login.html">Log in</a></p></section></main>
  <script src="js/main.js"></script>
</body>
</html>
